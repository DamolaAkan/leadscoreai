<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · LeadScoreAI</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#16202e;padding:24px;box-sizing:border-box}
  .card{max-width:340px;text-align:center;background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 12px 40px -16px rgba(76,29,149,.25)}
  img{width:56px;height:56px;border-radius:14px}
  h1{font-size:20px;margin:16px 0 6px}
  p{color:#667085;font-size:15px;line-height:1.5;margin:0 0 20px}
  button{background:#6d28d9;color:#fff;border:0;border-radius:999px;font-weight:700;font-size:15px;padding:12px 22px}
</style>
</head>
<body>
  <div class="card">
    <img src="/pwa/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your internet connection. Your quizzes and leads are safe and will load when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
